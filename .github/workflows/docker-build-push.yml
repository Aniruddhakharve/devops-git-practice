name: docker build and push

on:
  push:
    branches: [ main]

jobs:
  build-and-push:
    runs-on: ubuntu:latest

    steps:
        - name: code checkout
          uses: actions/checkout@v7

        - name: setup up docker buildx
          uses: docker/setup-buildx-action@v3

        # Login into docker
        - name: Log in to Docker Hub
          uses: docker/login-action@v3
          with:
            username: ${{ vars.DOCKERHUB_USER}}
            password: ${{ secrets.DOCKERHUB_TOKEN }}

        # Step 5: Build the image and push it to the registry

        - name: build and push
          uses: docker/build-push-action@v6
          with:
            context: .
            file: Dockerfile
            push: true
            tags: | 
              ${{vars.DOCKERHUB_USER}}/appss:latest
              ${{ vars.DOCKERHUB_USER }}/appss:${{ github.sha }}
              ${{ vars.DOCKERHUB_USER }}/appss:${{ github.HEAD_REF }}
            