#uses triviy image scanner for scanning docker images for CVES
name: Image scanner

on:
  workflow_call:

jobs:
    image-scanner:
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v7

            # Login into docker
            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                username: ${{ vars.DOCKERHUB_USER}}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Check Python packages
              run: |
                docker pull ${{ vars.DOCKERHUB_USER }}/appss:${{ github.sha }}
                docker run --rm ${{ vars.DOCKERHUB_USER }}/appss:${{ github.sha }} \
                python -c "import msgpack, setuptools; print('msgpack:', msgpack.__version__); print('setuptools:', setuptools.__version__)"


            - name: triviy image scan
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                version: 'v0.74.0'
                image-ref: ${{ vars.DOCKERHUB_USER }}/appss:${{ github.sha }}
                scan-type: 'image'
                format: 'table'
          # Set exit-code to '1' to break the build if issues are found
                exit-code: '1'
                ignore-unfixed: true
                severity: 'CRITICAL,HIGH'
                