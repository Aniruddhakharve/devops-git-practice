#this will deploy the safe /secure/ tested app to server

name: deploy to server

on:
  workflow_call:

jobs: 
    deploy:
      runs-on: ubuntu-latest
      env:
        DOCKERHUB_USER: ${{ vars.DOCKERHUB_USER }}
        DOCKER_TAG: ${{ github.sha }}
      steps:
        - name: checkout code
          uses: actions/checkout@v7


        - name: SSH to Prod server & create app folder
          uses: appleboy/ssh-action@v0.1.9
          with:
            host: ${{ secrets.EC2_SSH_HOST }}
            username: ${{ secrets.EC2_SSH_USER }}
            key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
            script: |
                echo "Installing required packages & folders"
                if ! command -v docker &> /dev/null
                then
                    echo "Docker not found. Installing Docker..."

                    sudo apt-get update
                    sudo apt-get install -y docker.io docker-compose-v2

                    sudo systemctl enable docker
                    sudo systemctl start docker

                    sudo usermod -aG docker $USER

                    echo "Docker installation completed."
                else
                    echo "Docker is already installed."
                fi

                # echo "Installing required packages & folders"
                #  sudo apt-get update && sudo apt-get install docker.io docker-compose-v2 -y
                #  sudo usermod -aG docker $USER
                 mkdir -p devops

        - name: Copy files via SSH
          uses: appleboy/scp-action@v1
          with:
            host: ${{ secrets.EC2_SSH_HOST }}
            username: ${{ secrets.EC2_SSH_USER }}
            key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
            source: docker-compose.yml
            target: ~/devops/

        - name: ssh to prod server and deploy
          uses: appleboy/ssh-action@v0.1.9
          with:
            host: ${{ secrets.EC2_SSH_HOST }}
            username: ${{ secrets.EC2_SSH_USER }}
            key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
            envs: DOCKERHUB_USER,DOCKERHUB_TOKEN,DOCKER_TAG
            script: |
                 echo "Running App"
                
                 export DOCKERHUB_USER=${{ vars.DOCKERHUB_USER }}
                 export DOCKER_TAG=${{ github.sha }}
                 echo ${{ secrets.DOCKERHUB_TOKEN }} | docker login --username ${{ vars.DOCKERHUB_USER }} --password-stdin
                 cd ~/devops && docker compose down && docker compose up -d  --force-recreate --pull always