name: hello-workflow

on:
 push:
   branches: [main]
   paths:
     - '*/*/hello.yml'
  

jobs:
  greet:
    runs-on:
      - ubuntu-slim
    steps:
      - name: say hello to users
        run: echo "hello dosto"
        
      - name: say hello to username
        run : echo "hello $USER"

  details:
    runs-on: ubuntu-latest
    steps:
      - name: show python & docker version
        run: python3 --version && docker --version

  
