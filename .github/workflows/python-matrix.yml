name: python lint

on:
  push:
    branches: [ main]


jobs:
  validate:  
    runs-on: ubuntu-latest
    strategy:
        fail-fast: false
        matrix:
            python-version: ["3.9","3.10","3.12","3.13"]
    steps:
        - name: checkout code
          uses: actions/checkout@v7
          
        - name: setup python 
          uses: actions/setup-python@v7
          with:
            python-version: ${{matrix.python-version}}

        - name: install libraries & dependencies
          run: |
            pip install -r requirements.txt

        - name: run linit flake 8
          run: |
            flake8  app.py
