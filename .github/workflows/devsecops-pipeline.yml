name: devsecops end to end pipeline

on: 
  push:
    branches: [ main]

jobs:

  # CI (Continuous Integration with security scanning) jobs
    job1:
      uses: ./.github/workflows/code-quality.yml

    job2: 
      uses: ./.github/workflows/secrets-scans.yml

    job3:
      uses: ./.github/workflows/dependncy-scan.yml

    job4:
      uses: ./.github/workflows/docker-lint.yml


    # run job5 after all security scans are completed and passed successfully  
    build:
      uses: ./.github/workflows/docker-build-push.yml
      secrets: inherit
      needs: [job1, job2, job3, job4]

    trivy:
      uses: ./.github/workflows/image-scanner.yml
      needs: [build]
      secrets: inherit

    #deploy to production
    deploy:
      needs: [trivy]
      uses: ./.github/workflows/deploy-to-server.yml
      secrets: inherit
      

    